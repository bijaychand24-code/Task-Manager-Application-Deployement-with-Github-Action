<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login - Task Manager</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={darkMode:'class'};if(localStorage.dark==='1')document.documentElement.classList.add('dark')</script></head>
<body class="min-h-screen flex items-center justify-center bg-slate-100 dark:bg-slate-900 p-4">
<div class="w-full max-w-sm bg-white dark:bg-slate-800 p-6 rounded-xl shadow space-y-3">
<h1 id="t" class="text-xl font-bold dark:text-white">Login</h1>
<input id="e" type="email" placeholder="Email" class="w-full p-2 border rounded dark:bg-slate-700 dark:text-white">
<input id="p" type="password" placeholder="Password (min 6 chars)" class="w-full p-2 border rounded dark:bg-slate-700 dark:text-white">
<p id="m" class="text-sm text-red-500"></p>
<button id="b" class="w-full bg-indigo-600 text-white py-2 rounded">Login</button>
<a href="#" id="sw" class="text-sm text-indigo-500">Need an account? Register</a></div>
<script>
const $=i=>document.getElementById(i);let reg=false;
const err=async r=>{const j=await r.json().catch(()=>({}));return typeof j.detail==='string'?j.detail:'Invalid input (password needs 6+ chars)'};
$('sw').onclick=e=>{e.preventDefault();reg=!reg;$('t').textContent=$('b').textContent=reg?'Register':'Login';$('sw').textContent=reg?'Have an account? Login':'Need an account? Register'};
$('b').onclick=async()=>{
 const body=JSON.stringify({email:$('e').value,password:$('p').value}),h={'Content-Type':'application/json'};
 if(reg){const r=await fetch('/api/register',{method:'POST',headers:h,body});if(!r.ok)return $('m').textContent=await err(r)}
 const r=await fetch('/api/login',{method:'POST',headers:h,body});
 if(r.ok)location='/';else $('m').textContent=await err(r)};
</script></body></html>
